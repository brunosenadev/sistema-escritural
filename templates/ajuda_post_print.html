<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ post.titulo }} — Sisplan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #fff;
      color: #1e293b;
      padding: 40px 48px;
      max-width: 860px;
      margin: 0 auto;
    }

    /* ── Cabeçalho ── */
    .print-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 28px;
    }
    .print-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .print-logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #1e4fc4, #3b82f6);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .print-logo-icon svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
    .print-logo-nome { font-size: 15px; font-weight: 700; color: #1e293b; letter-spacing: -0.3px; }
    .print-meta-header { font-size: 11px; color: #94a3b8; text-align: right; line-height: 1.6; }

    /* ── Título e meta ── */
    .print-topico {
      font-size: 11px; font-weight: 700; color: #2563eb;
      text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 8px;
    }
    .print-titulo {
      font-size: 24px; font-weight: 700; color: #0f172a;
      letter-spacing: -0.5px; line-height: 1.3;
      margin-bottom: 10px;
    }
    .print-data {
      font-size: 12px; color: #94a3b8;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid #f1f5f9;
    }

    /* ── Conteúdo ── */
    .print-conteudo { font-size: 13.5px; line-height: 1.8; color: #334155; }
    .print-conteudo h1 { font-size: 19px; font-weight: 700; color: #0f172a; margin: 24px 0 10px; }
    .print-conteudo h2 { font-size: 16px; font-weight: 700; color: #0f172a; margin: 20px 0 8px; }
    .print-conteudo h3 { font-size: 14px; font-weight: 600; color: #1e293b; margin: 16px 0 6px; }
    .print-conteudo p  { margin-bottom: 12px; }
    .print-conteudo ul, .print-conteudo ol { margin: 0 0 12px 22px; }
    .print-conteudo li { margin-bottom: 4px; }
    .print-conteudo strong { color: #0f172a; font-weight: 600; }
    .print-conteudo em { font-style: italic; }
    .print-conteudo a { color: #2563eb; text-decoration: underline; }
    .print-conteudo blockquote {
      border-left: 3px solid #93c5fd;
      padding-left: 14px; color: #475569;
      margin: 12px 0; font-style: italic;
    }
    .print-conteudo code {
      background: #f1f5f9; padding: 2px 6px;
      border-radius: 4px; font-size: 12px;
      font-family: 'Courier New', monospace;
    }
    .print-conteudo pre {
      background: #0f172a; color: #e2e8f0;
      padding: 14px; border-radius: 8px;
      overflow-x: auto; margin-bottom: 12px;
      font-family: 'Courier New', monospace;
      font-size: 12px; line-height: 1.6;
    }
    .print-conteudo img {
      max-width: 100%; border-radius: 6px;
      margin: 12px 0; display: block;
      border: 1px solid #e2e8f0;
    }
    .print-conteudo table {
      width: 100%; border-collapse: collapse; margin-bottom: 12px;
    }
    .print-conteudo th, .print-conteudo td {
      border: 1px solid #e2e8f0; padding: 8px 12px;
      font-size: 13px; text-align: left;
    }
    .print-conteudo th { background: #f8fafc; font-weight: 600; }

    /* ── Rodapé ── */
    .print-footer {
      margin-top: 40px; padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      font-size: 11px; color: #94a3b8;
      display: flex; justify-content: space-between;
    }

    /* ── Botão de impressão (some ao imprimir) ── */
    .btn-imprimir-wrap {
      position: fixed; bottom: 28px; right: 28px;
      display: flex; gap: 10px; z-index: 100;
    }
    .btn-imprimir {
      padding: 10px 20px;
      background: linear-gradient(135deg, #1e4fc4, #3b82f6);
      color: #fff; border: none; border-radius: 10px;
      font-size: 13px; font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer; box-shadow: 0 4px 14px rgba(37,99,235,0.35);
      display: flex; align-items: center; gap: 7px;
    }
    .btn-imprimir:hover { opacity: 0.92; }
    .btn-imprimir svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; }
    .btn-fechar {
      padding: 10px 16px;
      background: #f1f5f9; color: #475569;
      border: none; border-radius: 10px;
      font-size: 13px; font-weight: 600;
      font-family: 'Inter', sans-serif; cursor: pointer;
    }

    /* ── Print media — esconde os botões e ajusta layout ── */
    @media print {
      .btn-imprimir-wrap { display: none !important; }
      body { padding: 20px 28px; }
      .print-conteudo img { break-inside: avoid; }
      .print-conteudo h1,
      .print-conteudo h2,
      .print-conteudo h3 { break-after: avoid; }
    }
  </style>
</head>
<body>

  <div class="print-header">
    <div class="print-logo">
      <div class="print-logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <span class="print-logo-nome">Sisplan</span>
    </div>
    <div class="print-meta-header">
      Sisplan Sistemas<br>
      Exportado em {{ now }}
    </div>
  </div>

  {% if topico %}
  <div class="print-topico">{{ topico.nome }}</div>
  {% endif %}
  <h1 class="print-titulo">{{ post.titulo }}</h1>
  <div class="print-data">Atualizado em {{ post.atualizado_em }}</div>

  <div class="print-conteudo">{{ post.conteudo | safe }}</div>

  <div class="print-footer">
    <span>Sisplan Sistemas — Documento gerado automaticamente</span>
    <span>{{ post.titulo }}</span>
  </div>

  <div class="btn-imprimir-wrap">
    <button class="btn-fechar" onclick="window.close()">Fechar</button>
    <button class="btn-imprimir" onclick="window.print()">
      <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Salvar como PDF
    </button>
  </div>

</body>
</html>
