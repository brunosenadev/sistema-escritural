<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manutenção — Sisplan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #0a1628;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e2e8f0;
    }
    .box {
      text-align: center;
      padding: 48px 40px;
      max-width: 420px;
    }
    .icon {
      width: 64px; height: 64px;
      margin: 0 auto 24px;
      background: rgba(59,130,246,0.12);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg {
      width: 32px; height: 32px;
      stroke: #3b82f6; fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    h1 { font-size: 22px; font-weight: 700; color: #f1f5f9; margin-bottom: 10px; }
    p  { font-size: 14px; color: #94a3b8; line-height: 1.65; }
    .dot {
      display: inline-block;
      width: 6px; height: 6px; border-radius: 50%;
      background: #3b82f6;
      margin: 28px 4px 0;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1);   }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <h1>Sistema em manutenção</h1>
    <p>Estamos realizando uma atualização e voltamos em breve.<br>Obrigado pela paciência.</p>
    <div>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>
</body>
</html>
